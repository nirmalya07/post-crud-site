<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post CRUD App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Post CRUD App</h1>
  <div class="container">
    <form id="postForm">
      <input type="text" id="title" placeholder="Enter title" required>
      <textarea id="content" rows="3" placeholder="Enter content" required></textarea>
      <button type="submit">Add Post</button>
    </form>

    <div id="posts"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
